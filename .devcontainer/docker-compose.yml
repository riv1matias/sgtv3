services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:22
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    environment:
      DATABASE_URL: postgres://postgres:sgt@db:5432/sgt
    depends_on: [db]
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: sgt
      POSTGRES_DB: sgt
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
